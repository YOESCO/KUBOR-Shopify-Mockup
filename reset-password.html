<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUBOR — Restablecer contraseña</title><meta name="theme-color" content="#07131b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="core-v4.css?v=20261014"><link rel="stylesheet" href="account-flow.css?v=20261014"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script defer src="core-v4.js?v=20261014"></script></head><body class="account-page"><header></header><main class="account-auth"><section class="account-auth-card"><div class="k-eyebrow" style="color:#008da1">Seguridad de cuenta</div><h1 class="k-display" style="font-size:48px;line-height:.9;text-transform:uppercase;margin:7px 0 10px">Crea una nueva contraseña</h1><p style="font-size:11px;color:#687681;line-height:1.6">Usa una contraseña nueva para recuperar acceso a pedidos, direcciones, garantías y bicicletas registradas.</p><form id="reset-form" class="account-form" style="margin-top:22px"><label>Nueva contraseña<input id="p1" required type="password" minlength="8" autocomplete="new-password"></label><label>Confirmar contraseña<input id="p2" required type="password" minlength="8" autocomplete="new-password"></label><button class="k-btn k-btn-dark" type="submit" style="width:100%">Guardar contraseña</button></form><div id="reset-status" class="account-form-status" hidden></div><a href="login.html" style="display:inline-block;margin-top:18px;font-size:9px;font-weight:900;text-transform:uppercase;color:#008da1">← Volver a iniciar sesión</a></section></main><script>document.getElementById('reset-form').addEventListener('submit',e=>{e.preventDefault();const a=document.getElementById('p1').value,b=document.getElementById('p2').value,s=document.getElementById('reset-status');s.hidden=false;if(a!==b){s.textContent='Las contraseñas no coinciden.';s.className='account-form-status is-error';return}s.textContent='Contraseña actualizada en el mockup. En Shopify este flujo lo controla Customer Accounts.';s.className='account-form-status is-success';e.currentTarget.reset()})</script></body></html>
