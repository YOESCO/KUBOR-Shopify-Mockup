<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUBOR — Crear cuenta</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="v2.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script defer src="app-v2.js"></script></head><body class="bg-[#f5f7f8] text-[#253045]"><main class="min-h-screen pt-24 pb-12"><section class="ref-section max-w-[820px]"><div class="bg-white border rounded-xl p-6 md:p-8"><p class="text-cyan-600 text-[10px] uppercase font-black tracking-[.16em]">Cuenta KUBOR</p><h1 class="font-display text-5xl uppercase text-[#07131b] mt-2">Crea tu cuenta</h1><p class="text-sm text-slate-500 mt-2">Guarda tus bicicletas, pedidos, garantías y favoritos.</p><form class="mt-7 grid sm:grid-cols-2 gap-4" onsubmit="event.preventDefault();location.href='account.html'"><label><span class="text-[10px] uppercase font-black">Nombre</span><input required class="mt-2 w-full h-12 border px-4" placeholder="Nombre"></label><label><span class="text-[10px] uppercase font-black">Apellido</span><input required class="mt-2 w-full h-12 border px-4" placeholder="Apellido"></label><label class="sm:col-span-2"><span class="text-[10px] uppercase font-black">Correo</span><input type="email" required class="mt-2 w-full h-12 border px-4" placeholder="tu@correo.com"></label><label class="sm:col-span-2"><span class="text-[10px] uppercase font-black">Contraseña</span><input type="password" required class="mt-2 w-full h-12 border px-4" placeholder="Mínimo 8 caracteres"></label><label class="sm:col-span-2 flex gap-2 text-xs text-slate-500"><input type="checkbox"> Quiero recibir lanzamientos, promociones y contenido KUBOR.</label><button class="sm:col-span-2 h-12 bg-[#07131b] text-white uppercase text-[10px] font-black">Crear cuenta</button></form><div class="mt-6 pt-6 border-t text-sm">¿Ya tienes cuenta? <a href="login.html" class="font-black tex
